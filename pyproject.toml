[project]
name = "bookstore"
version = "0.1.0"
description = "ПС «Книгарня»: облік каталогу, замовлень і бонусів"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["bookstore"]
